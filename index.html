<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CPIM Study Tracker</title>
<style>
body{font-family:Arial,'Noto Sans KR',sans-serif;background:#f4f6f8;color:#222;margin:0}.wrap{max-width:1400px;margin:auto;padding:24px}
h1{margin:0 0 5px}.sub{color:#667085;margin-bottom:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:15px}.label{font-size:13px;color:#667085}.num{font-size:24px;font-weight:700;margin:6px 0}
.bar{height:8px;background:#edf0f3;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;background:#2563eb;width:0}.s{background:#f59e0b}.t{background:#7c3aed}.tm{background:#16a34a}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.controls input,.controls select,.controls button{padding:10px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;font-size:14px}
.controls input{flex:1;min-width:260px}.table{background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:980px}
th,td{padding:10px;border-bottom:1px solid #eee;font-size:14px}th{background:#f9fafb;position:sticky;top:0;text-align:left}.c{text-align:center}.check{width:20px;height:20px}
.done{background:#f4fff6}.foot{font-size:12px;color:#667085;margin-top:10px}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}}@media(max-width:500px){.stats{grid-template-columns:1fr}.wrap{padding:12px}}
</style></head><body><div class="wrap">
<h1>CPIM Study Tracker</h1><div class="sub">61강 수강 · Summary · Textbook 학습 진행률 관리</div>
<div class="stats">
<div class="card"><div class="label">수강 완료</div><div id="lc" class="num">0 / 61</div><div id="lp" class="label">0%</div><div class="bar"><div id="lb" class="fill"></div></div></div>
<div class="card"><div class="label">수강 완료 시간</div><div id="tc" class="num">0분</div><div id="tp" class="label">0%</div><div class="bar"><div id="tb" class="fill tm"></div></div></div>
<div class="card"><div class="label">Summary</div><div id="sc" class="num">0 / 61</div><div id="sp" class="label">0%</div><div class="bar"><div id="sb" class="fill s"></div></div></div>
<div class="card"><div class="label">Textbook</div><div id="bc" class="num">0 / 61</div><div id="bp" class="label">0%</div><div class="bar"><div id="bb" class="fill t"></div></div></div>
</div>
<div class="controls"><input id="q" placeholder="강좌 검색"><select id="cat"><option value="all">전체</option><option>개론</option><option>Wrap-up</option><option>실전 문제풀이</option></select>
<select id="st"><option value="all">전체 상태</option><option value="incomplete">수강 미완료</option><option value="lecture">수강 완료</option><option value="all3">3종 모두 완료</option></select>
<button id="backup">백업 저장</button><button id="restore">백업 불러오기</button><button id="reset">전체 초기화</button><input id="file" type="file" accept=".json" hidden></div>
<div class="table"><table><thead><tr><th class="c">No.</th><th>구분</th><th>강좌명</th><th class="c">시간</th><th class="c">강의 수강</th><th class="c">Summary</th><th class="c">Textbook</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="foot">체크 상태는 현재 브라우저에 자동 저장됩니다. 다른 PC에서는 백업 저장/불러오기를 사용하세요.</div>
</div><script>
const courses=[{"id": 1, "category": "개론", "title": "[CP9] 0. Introduction to CPIM Class", "minutes": 60}, {"id": 2, "category": "개론", "title": "[CP9] 0. How to register CPIM exam", "minutes": 9}, {"id": 3, "category": "개론", "title": "[CP9] 1. Overview of Supply Chain Structure - Introduction to SCM (1/2)", "minutes": 55}, {"id": 4, "category": "개론", "title": "[CP9] 2. Overview of Supply Chain Structure - Introduction to SCM (2/2)", "minutes": 55}, {"id": 5, "category": "개론", "title": "[CP9] 3. Overview of Supply Chain Structure - MPCS, Innovation of Manufacturing", "minutes": 92}, {"id": 6, "category": "개론", "title": "[CP9] 4. Overview of Supply Chain Structure - Manufacturing Environment, Review of Textbook", "minutes": 60}, {"id": 7, "category": "개론", "title": "[CP9] 5. Overview of Supply Chain Structure - Review of Textbook (MPCS)", "minutes": 70}, {"id": 8, "category": "개론", "title": "[CP9] 6. Overview of Supply Chain Structure - Solve Review Questions", "minutes": 37}, {"id": 9, "category": "개론", "title": "[CP9] 7. Developing Sustainable Strategy (1/2)", "minutes": 83}, {"id": 10, "category": "개론", "title": "[CP9] 8. Developing Sustainable Strategy (2/2) - Review Textbook & Solve Review Questions", "minutes": 71}, {"id": 11, "category": "개론", "title": "[CP9] 9. Sustainability", "minutes": 102}, {"id": 12, "category": "개론", "title": "[CP9] 10. Financial Analysis & Technique (1/3)", "minutes": 55}, {"id": 13, "category": "개론", "title": "[CP9] 11. Financial Analysis & Technique (2/3)", "minutes": 48}, {"id": 14, "category": "개론", "title": "[CP9] 12. Financial Analysis & Technique (3/3) - Review Textbook & Solve Review Questions", "minutes": 50}, {"id": 15, "category": "개론", "title": "[CP9] 13. Operation Performance (1/4)", "minutes": 49}, {"id": 16, "category": "개론", "title": "[CP9] 14. Operation Performance (2/4)", "minutes": 36}, {"id": 17, "category": "개론", "title": "[CP9] 15. Operation Performance (3/4) - Review Textbook", "minutes": 76}, {"id": 18, "category": "개론", "title": "[CP9] 16. Operation Performance (4/4) - Solve Review Questions", "minutes": 36}, {"id": 19, "category": "개론", "title": "[CP9] 17. Infrastructure (1/2)", "minutes": 64}, {"id": 20, "category": "개론", "title": "[CP9] 18. Infrastructure (2/2) - Review Textbook & Solve Review Questions", "minutes": 38}, {"id": 21, "category": "개론", "title": "[CP9] 19. Demand Management Process", "minutes": 55}, {"id": 22, "category": "개론", "title": "[CP9] 20. Demand Forecasting & Customer Management", "minutes": 62}, {"id": 23, "category": "개론", "title": "[CP9] 21. Demand Management - Review Textbook (1/2)", "minutes": 71}, {"id": 24, "category": "개론", "title": "[CP9] 22. Demand Management - Review Textbook (2/2)", "minutes": 46}, {"id": 25, "category": "개론", "title": "[CP9] 23. Demand Management - Solve Review Questions", "minutes": 33}, {"id": 26, "category": "개론", "title": "[CP9] 24. Sales and Operations Plan (1/2)", "minutes": 46}, {"id": 27, "category": "개론", "title": "[CP9] 25. Sales and Operations Plan (2/2) - Review Textbook & Solve Review Questions", "minutes": 73}, {"id": 28, "category": "개론", "title": "[CP9] 26. Master Scheduling (1/2)", "minutes": 86}, {"id": 29, "category": "개론", "title": "[CP9] 27. Master Scheduling (2/2) - Review Textbook & Solve Review Questions", "minutes": 88}, {"id": 30, "category": "개론", "title": "[CP9] 28. Material Requirements Planning", "minutes": 82}, {"id": 31, "category": "개론", "title": "[CP9] 29. Capacity Management", "minutes": 93}, {"id": 32, "category": "개론", "title": "[CP9] 30. Strategic Sourcing (1/2)", "minutes": 44}, {"id": 33, "category": "개론", "title": "[CP9] 31. Strategic Sourcing (2/2) - Review Textbook & Solve Review Questions", "minutes": 58}, {"id": 34, "category": "개론", "title": "[CP9] 32. Inventory Management (1/3)", "minutes": 72}, {"id": 35, "category": "개론", "title": "[CP9] 33. Inventory Management (2/3) - Review Textbook (1/2)", "minutes": 44}, {"id": 36, "category": "개론", "title": "[CP9] 34. Inventory Management (3/3) - Review Textbook (2/2) & Solve Review Questions", "minutes": 51}, {"id": 37, "category": "개론", "title": "[CP9] 35. Distribution Planning", "minutes": 84}, {"id": 38, "category": "개론", "title": "[CP9] 36. Production Activity Control", "minutes": 86}, {"id": 39, "category": "개론", "title": "[CP9] 37. Scheduling (1/2)", "minutes": 41}, {"id": 40, "category": "개론", "title": "[CP9] 38. Scheduling (2/2) - Review Textbook & Solve Review Questions", "minutes": 54}, {"id": 41, "category": "개론", "title": "[CP9] 39. Quality Management", "minutes": 70}, {"id": 42, "category": "개론", "title": "[CP9] 40. Service Design, Project Management and Technology", "minutes": 63}, {"id": 43, "category": "Wrap-up", "title": "[CP9W] 1. Wrap up (1/4)", "minutes": 66}, {"id": 44, "category": "Wrap-up", "title": "[CP9W] 2. Wrap up (2/4)", "minutes": 69}, {"id": 45, "category": "Wrap-up", "title": "[CP9W] 3. Wrap up (3/4)", "minutes": 36}, {"id": 46, "category": "Wrap-up", "title": "[CP9W] 4. Wrap up (4/4)", "minutes": 47}, {"id": 47, "category": "실전 문제풀이", "title": "[CP9S] 0. Study Material Download (Wrapup + 문제풀이)", "minutes": 1}, {"id": 48, "category": "실전 문제풀이", "title": "[CP9S] 1. Supply Chain Overview", "minutes": 65}, {"id": 49, "category": "실전 문제풀이", "title": "[CP9S] 2. Develop Strategy (1/2)", "minutes": 63}, {"id": 50, "category": "실전 문제풀이", "title": "[CP9S] 3. Develop Strategy (2/2)", "minutes": 79}, {"id": 51, "category": "실전 문제풀이", "title": "[CP9S] 4. Demand Management & SOP (1/2)", "minutes": 67}, {"id": 52, "category": "실전 문제풀이", "title": "[CP9S] 5. Demand Management & SOP (2/2)", "minutes": 74}, {"id": 53, "category": "실전 문제풀이", "title": "[CP9S] 6. MPS, MRP, Capacity Management (1/2)", "minutes": 50}, {"id": 54, "category": "실전 문제풀이", "title": "[CP9S] 7. MPS, MRP, Capacity Management (2/2)", "minutes": 59}, {"id": 55, "category": "실전 문제풀이", "title": "[CP9S] 8. Inventory Management & DRP", "minutes": 81}, {"id": 56, "category": "실전 문제풀이", "title": "[CP9S] 9. Purchasing and Cost Analysis", "minutes": 67}, {"id": 57, "category": "실전 문제풀이", "title": "[CP9S] 10. Execution & Quality Management", "minutes": 74}, {"id": 58, "category": "실전 문제풀이", "title": "[CP9S] 11. Final 100 Questions (Series A) (1/2)", "minutes": 55}, {"id": 59, "category": "실전 문제풀이", "title": "[CP9S] 12. Final 100 Questions (Series A) (2/2)", "minutes": 47}, {"id": 60, "category": "실전 문제풀이", "title": "[CP9S] 13. Final 150 Questions (Series B) (1/2)", "minutes": 76}, {"id": 61, "category": "실전 문제풀이", "title": "[CP9S] 14. Final 150 Questions (Series B) (2/2)", "minutes": 54}];
const key='cpimTrackerV1';let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}
function s(id){if(!state[id])state[id]={lecture:false,summary:false,textbook:false};return state[id]}
function save(){localStorage.setItem(key,JSON.stringify(state))}
function fmt(m){let h=Math.floor(m/60),r=m%60;return h?`${h}시간 ${r}분`:`${r}분`}
function stats(){let l=0,sm=0,b=0,min=0,total=courses.reduce((a,x)=>a+x.minutes,0);courses.forEach(x=>{let z=s(x.id);if(z.lecture){l++;min+=x.minutes}if(z.summary)sm++;if(z.textbook)b++});
let p=n=>n/courses.length*100,pt=min/total*100;
lc.textContent=`${l} / ${courses.length}`;lp.textContent=p(l).toFixed(1)+'%';lb.style.width=p(l)+'%';
tc.textContent=fmt(min);tp.textContent=`총 ${fmt(total)} 중 ${pt.toFixed(1)}%`;tb.style.width=pt+'%';
sc.textContent=`${sm} / ${courses.length}`;sp.textContent=p(sm).toFixed(1)+'%';sb.style.width=p(sm)+'%';
bc.textContent=`${b} / ${courses.length}`;bp.textContent=p(b).toFixed(1)+'%';bb.style.width=p(b)+'%'}
function render(){let qq=q.value.toLowerCase().trim(),cc=cat.value,ss=st.value;rows.innerHTML='';
courses.filter(x=>{let z=s(x.id),ok=!qq||x.title.toLowerCase().includes(qq);ok=ok&&(cc==='all'||x.category===cc);if(ss==='incomplete')ok=ok&&!z.lecture;if(ss==='lecture')ok=ok&&z.lecture;if(ss==='all3')ok=ok&&z.lecture&&z.summary&&z.textbook;return ok})
.forEach(x=>{let z=s(x.id),tr=document.createElement('tr');if(z.lecture&&z.summary&&z.textbook)tr.className='done';tr.innerHTML=`<td class=c>${x.id}</td><td>${x.category}</td><td>${x.title}</td><td class=c>${fmt(x.minutes)}</td>
<td class=c><input class=check type=checkbox data-id=${x.id} data-k=lecture ${z.lecture?'checked':''}></td><td class=c><input class=check type=checkbox data-id=${x.id} data-k=summary ${z.summary?'checked':''}></td><td class=c><input class=check type=checkbox data-id=${x.id} data-k=textbook ${z.textbook?'checked':''}></td>`;rows.appendChild(tr)});stats()}
rows.addEventListener('change',e=>{if(!e.target.matches('.check'))return;let z=s(e.target.dataset.id);z[e.target.dataset.k]=e.target.checked;save();render()});
q.addEventListener('input',render);cat.addEventListener('change',render);st.addEventListener('change',render);
reset.onclick=()=>{if(confirm('모든 체크를 초기화할까요?')){state={};save();render()}};
backup.onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cpim-study-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
restore.onclick=()=>file.click();file.onchange=()=>{let f=file.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();render();alert('백업을 불러왔습니다.')}catch(e){alert('올바른 백업 파일이 아닙니다.')}};r.readAsText(f);file.value=''};
render();
</script></body></html>
